# 发布工作流：推送 v* 标签 → Windows 构建 → 自动发布 GitHub Releases
# 产物：DevWorkbench Setup {version}.exe + .blockmap + latest.yml（支持 electron-updater 自动更新）
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 校验 tag 与 package.json 版本一致
        shell: pwsh
        run: |
          $tag = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $pkg) {
            Write-Error "tag ($tag) 与 package.json version ($pkg) 不一致，请先更新版本号"
            exit 1
          }

      - name: 缓存 Electron / electron-builder 二进制
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: eb-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 安装依赖
        run: npm ci

      - name: 运行测试
        run: npm test

      - name: 构建并发布到 GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run electron:publish
