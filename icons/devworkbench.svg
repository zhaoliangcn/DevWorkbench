<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1d24"/>
      <stop offset="1" stop-color="#0f1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- 底板：暗色圆角方块 -->
  <rect x="32" y="32" width="960" height="960" rx="176" fill="url(#bg)"/>

  <!-- 工作台面板（内框微光） -->
  <rect x="120" y="120" width="784" height="784" rx="128" fill="none" stroke="url(#accent)" stroke-opacity="0.12" stroke-width="6"/>

  <!-- 代码符号 < / > -->
  <g stroke="url(#accent)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="400,330 220,512 400,694"/>
    <polyline points="624,330 804,512 624,694"/>
  </g>

  <!-- 斜杠：双笔触（代码感 + 齿轮斜线隐喻） -->
  <line x1="560" y1="330" x2="464" y2="694" stroke="#f59e0b" stroke-width="44" stroke-linecap="round"/>
  <line x1="584" y1="360" x2="488" y2="724" stroke="#f59e0b" stroke-opacity="0.45" stroke-width="14" stroke-linecap="round"/>

  <!-- 中心齿轮（工具箱隐喻） -->
  <g transform="translate(512,512)">
    <g fill="url(#accent)">
      <rect x="-22" y="-168" width="44" height="56" rx="14" transform="rotate(0)"/>
      <rect x="-22" y="-168" width="44" height="56" rx="14" transform="rotate(45)"/>
      <rect x="-22" y="-168" width="44" height="56" rx="14" transform="rotate(90)"/>
      <rect x="-22" y="-168" width="44" height="56" rx="14" transform="rotate(135)"/>
      <rect x="-22" y="-168" width="44" height="56" rx="14" transform="rotate(180)"/>
      <rect x="-22" y="-168" width="44" height="56" rx="14" transform="rotate(225)"/>
      <rect x="-22" y="-168" width="44" height="56" rx="14" transform="rotate(270)"/>
      <rect x="-22" y="-168" width="44" height="56" rx="14" transform="rotate(315)"/>
    </g>
    <circle r="148" fill="url(#bg)"/>
    <circle r="148" fill="none" stroke="url(#accent)" stroke-width="22"/>
    <circle r="64" fill="#f59e0b"/>
    <circle r="30" fill="url(#bg)"/>
  </g>
</svg>
